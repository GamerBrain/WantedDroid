[package]
name = "nfsmw_mods"
version = "0.1.0"
edition = "2021"
description = "Mod manifest/config validation and overlay planning for NFSMW Android Evolved"
license = "GPL-3.0-or-later"

[lib]
name = "nfsmw_mods"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
